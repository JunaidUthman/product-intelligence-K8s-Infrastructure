apiVersion: v1
kind: Secret
metadata:
  name: product-intel-secrets
  namespace: kubeflow
type: Opaque
stringData:
  # Database Host:
  # - For Local Minikube: "host.minikube.internal"
  # - For AWS EKS: your RDS endpoint (without :3306)
  MYSQL_HOST: "host.minikube.internal"
  MYSQL_USER: "appuser"
  MYSQL_PASSWORD: "password"
  MYSQL_DATABASE: "product_intelligence"

  # External APIs used by pipeline tasks
  DEEPSEEK_API_KEY: "your_deepseek_api_key"
  HF_TOKEN: "your_huggingface_token"
  HF_REPO_ID: "JunaidUTH/product-price-evolution"

