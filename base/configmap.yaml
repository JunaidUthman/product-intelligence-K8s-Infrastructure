apiVersion: v1
kind: ConfigMap
metadata:
  name: product-platform-config
  namespace: product-intelligence
data:
  # Internal DNS Service endpoints
  PREDICTION_API_URL: "http://product-price-api:8000/api/v1/predict"
  MCP_SERVER_URL: "http://product-intelligence-mcp:3001/sse"
  
  # ML Model Settings
  HF_REPO_ID: "JunaidUTH/product-price-evolution"
  MODEL_FILENAME: "xgboost_trend_model.pkl"
  
  # Service ports
  EXPLORER_PORT: "3000"
  MCP_PORT: "3001"
  PRICE_API_PORT: "8000"

  # Host database connection parameters
  MYSQL_HOST: "host.minikube.internal"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "product_intelligence"
