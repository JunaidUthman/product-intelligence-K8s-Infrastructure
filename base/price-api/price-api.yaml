apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-price-api
  namespace: product-intelligence
  labels:
    app.kubernetes.io/name: product-price-api
    app.kubernetes.io/component: inference-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: product-price-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-price-api
        app.kubernetes.io/component: inference-api
    spec:
      containers:
        - name: price-api
          image: product-price-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: product-platform-secrets
                  key: HF_TOKEN
            - name: HF_REPO_ID
              valueFrom:
                configMapKeyRef:
                  name: product-platform-config
                  key: HF_REPO_ID
            - name: MODEL_FILENAME
              valueFrom:
                configMapKeyRef:
                  name: product-platform-config
                  key: MODEL_FILENAME
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: product-platform-config
                  key: PRICE_API_PORT
            - name: HOST
              value: "0.0.0.0"
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: product-price-api
  namespace: product-intelligence
  labels:
    app.kubernetes.io/name: product-price-api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: product-price-api

