apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-intelligence-mcp
  namespace: product-intelligence
  labels:
    app.kubernetes.io/name: product-intelligence-mcp
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: product-intelligence-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-intelligence-mcp
        app.kubernetes.io/component: mcp-server
    spec:
      containers:
        - name: mcp-server
          image: junaiduthman/product-intelligence-mcp:v-beeb6ff
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: sse-http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: product-platform-secrets
                  key: DATABASE_URL
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: product-platform-config
                  key: MCP_PORT
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: product-intelligence-mcp
  namespace: product-intelligence
  labels:
    app.kubernetes.io/name: product-intelligence-mcp
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
      name: sse-http
  selector:
    app.kubernetes.io/name: product-intelligence-mcp
