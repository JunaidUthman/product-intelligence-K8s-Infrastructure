apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-explorer
  namespace: product-intelligence
  labels:
    app.kubernetes.io/name: product-explorer
    app.kubernetes.io/component: web-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: product-explorer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-explorer
        app.kubernetes.io/component: web-ui
    spec:
      containers:
        - name: explorer
          image: junaiduthman/product-explorer:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: product-platform-secrets
                  key: DATABASE_URL
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: product-platform-secrets
                  key: DEEPSEEK_API_KEY
            - name: PREDICTION_API_URL
              valueFrom:
                configMapKeyRef:
                  name: product-platform-config
                  key: PREDICTION_API_URL
            - name: MCP_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: product-platform-config
                  key: MCP_SERVER_URL
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: product-platform-config
                  key: EXPLORER_PORT
            - name: HOSTNAME
              value: "0.0.0.0"
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 25
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: product-explorer
  namespace: product-intelligence
  labels:
    app.kubernetes.io/name: product-explorer
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app.kubernetes.io/name: product-explorer

