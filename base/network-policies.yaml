# ==============================================================================
# Network Policies for product-intelligence namespace (Zero-Trust Security)
# ==============================================================================

# 1. Default Deny all Ingress traffic in the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: product-intelligence
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# 2. Allow CoreDNS egress for all pods (essential for internal/external name resolution)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: product-intelligence
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# 3. Explorer UI: Allow external user traffic in, internal API calls, and external DB/APIs
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: explorer-policy
  namespace: product-intelligence
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: product-explorer
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow communication to internal MCP server
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: product-intelligence-mcp
      ports:
        - protocol: TCP
          port: 3001
    # Allow communication to internal Price Prediction API
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: product-price-api
      ports:
        - protocol: TCP
          port: 8000
    # Allow communication to MySQL database (host machine via host.minikube.internal)
    - ports:
        - protocol: TCP
          port: 3306
    # Allow HTTPS to external LLM APIs (DeepSeek, etc.)
    - ports:
        - protocol: TCP
          port: 443
---
# 4. MCP Server: Only accept connections from Explorer, egress to local MySQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-server-policy
  namespace: product-intelligence
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: product-intelligence-mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: product-explorer
      ports:
        - protocol: TCP
          port: 3001
  egress:
    # Allow communication to MySQL database (host machine via host.minikube.internal)
    - ports:
        - protocol: TCP
          port: 3306
---
# 5. Price Prediction API: Only accept requests from Explorer, egress to Hugging Face
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: price-api-policy
  namespace: product-intelligence
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: product-price-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: product-explorer
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow HTTPS to download model weights from Hugging Face Hub
    - ports:
        - protocol: TCP
          port: 443
