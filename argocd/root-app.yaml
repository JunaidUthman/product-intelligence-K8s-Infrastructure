apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-application
  namespace: argocd
  # Finalizer omis volontairement pour protéger les applications enfants contre toute suppression accidentelle en cascade
spec:
  project: default
  source:
    repoURL: https://github.com/JunaidUthman/product-intelligence-K8s-Infrastructure.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

