apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: product-intelligence-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/JunaidUthman/product-intelligence-K8s-Infrastructure.git
    targetRevision: main
    path: base
  destination:
    server: https://kubernetes.default.svc
    namespace: product-intelligence
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

